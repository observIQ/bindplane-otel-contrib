type: log_type_detection

status:
  class: processor
  stability:
    development: [logs]
  distributions: []
  codeowners:
    active: [observIQ/ai]

telemetry:
  metrics:
    log_type_detection_runs:
      enabled: true
      description: "Number of log type detections run, one per newly seen log structure."
      stability: alpha
      unit: "{detections}"
      sum:
        value_type: int
        monotonic: true
