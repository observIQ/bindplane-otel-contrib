$defs:
  flow_control_config:
    description: FlowControlConfig defines the flow control configuration for the receiver. This is used to tune the internal flow control implementation, along with the Pub/Sub flow control settings documented at https://cloud.google.com/pubsub/docs/flow-control and https://cloud.google.com/pubsub/docs/reference/rpc/google.pubsub.v1#streamingpullrequest
    type: object
    properties:
      max_outstanding_bytes:
        description: Pub/Sub flow control settings for the maximum number of outstanding bytes.
        type: integer
        x-customType: int64
      max_outstanding_messages:
        description: Pub/Sub flow control settings for the maximum number of outstanding messages.
        type: integer
        x-customType: int64
      stream_ack_deadline:
        description: The ack deadline to use for the Pub/Sub stream.
        type: string
        format: duration
      trigger_ack_batch_duration:
        description: The maximum duration the acknowledgement loop waits before sending the acknowledgements.
        type: string
        format: duration
      trigger_ack_batch_size:
        description: The number of pending acknowledgements (acks and nacks combined) that triggers an immediate flush, without waiting for trigger_ack_batch_duration. 0 (the default) disables the size trigger.
        type: integer
type: object
properties:
  client_id:
    description: The client id that will be used by Pubsub to make load balancing decisions
    type: string
  compression:
    description: Lock down the compression of the payload, leave empty for attribute based detection
    type: string
  encoding:
    description: Lock down the encoding of the payload, leave empty for attribute based detection
    type: string
  endpoint:
    description: Override of the Pubsub Endpoint, leave empty for the default endpoint
    type: string
  flow_control:
    $ref: flow_control_config
  ignore_encoding_error:
    description: 'Ignore errors when the configured encoder fails to decoding a PubSub messages. Deprecated: use OnDecodeError set to "ignore" instead.'
    type: boolean
  insecure:
    description: Only has effect if Endpoint is not ""
    type: boolean
  on_decode_error:
    description: OnDecodeError sets how a message that the configured encoding fails to decode is handled. "propagate" (the default) leaves the message unacknowledged, so it is redelivered after the ack deadline expires. "ignore" acknowledges and drops the message. "nack" negatively acknowledges the message (a modify ack deadline of 0), so the subscription retry policy or dead letter policy applies.
    type: string
  on_pipeline_error:
    description: OnPipelineError sets how a message that the downstream pipeline rejects is handled. "ack" (the default) acknowledges and drops the message. "nack" negatively acknowledges the message, so the subscription retry policy or dead letter policy applies.
    type: string
  project:
    description: Google Cloud Project ID where the Pubsub client will connect to
    type: string
  subscription:
    description: The fully qualified resource name of the Pubsub subscription
    type: string
  universe_domain:
    description: UniverseDomain is the universe domain for the Pubsub service. Defaults to "googleapis.com". Set to support Sovereign Cloud regions. See https://pkg.go.dev/google.golang.org/api/option#WithUniverseDomain
    type: string
  user_agent:
    description: User agent that will be used by the Pubsub client to connect to the service
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/exporter/exporterhelper.timeout_config
