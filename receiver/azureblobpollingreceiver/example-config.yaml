# Example configuration for Azure Blob Polling Receiver
# This receiver continuously polls Azure Blob Storage at configurable intervals

# Basic configuration - polls every 10 minutes
receivers:
  azureblobpolling:
    connection_string: "DefaultEndpointsProtocol=https;AccountName=your_account_name;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
    container: "otel-data"
    poll_interval: 10m

# Complete production configuration with storage extension
extensions:
  file_storage:
    directory: /var/lib/otelcol/storage

receivers:
  # Metrics receiver - polls every 5 minutes
  azureblobpolling/metrics:
    connection_string: "DefaultEndpointsProtocol=https;AccountName=your_account_name;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
    container: "otel-metrics"
    poll_interval: 5m
    initial_lookback: 30m  # Look back 30 minutes on first startup
    storage: "file_storage"  # Persist checkpoint across restarts
    batch_size: 50
    page_size: 1000
  
  # Logs receiver - polls every 2 minutes (higher frequency)
  azureblobpolling/logs:
    connection_string: "DefaultEndpointsProtocol=https;AccountName=your_account_name;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
    container: "otel-logs"
    poll_interval: 2m
    initial_lookback: 15m
    storage: "file_storage"
    batch_size: 100
    page_size: 1000

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [azureblobpolling/metrics]
      exporters: [otlp]
    logs:
      receivers: [azureblobpolling/logs]
      exporters: [otlp]

# ------------------------------------------------------------------------------
# Azure NSG flow logs example
#
# Layout of NSG flow logs in Blob Storage:
#   flowLogResourceID=/<SUB>_<RG>/<NSG>/y=YYYY/m=MM/d=DD/h=HH/m=MM/macAddress=.../PT1H.json
#
# Notes:
#   - root_folder uses a glob (*) so one receiver covers every NSG in the container.
#   - The matched root is stripped from the blob name before time_pattern is applied,
#     so the same time_pattern works for every NSG.
#   - blob_format: records-json unwraps the {"records":[...]} envelope that
#     Azure writes for NSG flow logs (and most diagnostic-settings exports).
#   - filename_pattern restricts ingestion to the hourly PT1H.json file.
#   - enable_incremental_read ingests each hour's appends as they land, instead of
#     re-reading the whole PT1H.json every poll. See the README "Incremental reading of
#     append-growable blobs" section for the full option reference.
# ------------------------------------------------------------------------------
receivers:
  azureblobpolling/nsg_flow_logs:
    connection_string: "DefaultEndpointsProtocol=https;AccountName=your_account_name;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
    container: "insights-logs-networksecuritygroupflowevent"
    poll_interval: 5m
    initial_lookback: 1h
    root_folder: "flowLogResourceID=/*/*"
    time_pattern: "y={year}/m={month}/d={day}/h={hour}/m={minute}"
    telemetry_type: "logs"
    blob_format: "records-json"
    filename_pattern: "PT1H\\.json$"
    storage: "file_storage"  # required to persist byte offsets across restarts
    batch_size: 100
    page_size: 1000
    # Incremental reads (opt-in). Only enable_incremental_read is required; the rest
    # have sensible defaults shown here.
    enable_incremental_read: true
    incremental_revisit_window: 2h    # how long a growing blob is re-read; must be >= poll_interval
    fingerprint_size: 512             # leading bytes used to detect a replaced blob; min 16
    assume_append_only: false         # true skips the per-poll identity check (fewer ops, no replacement safety)

# ------------------------------------------------------------------------------
# Plain text logs, one record per line, ingested incrementally
#
# enable_per_line_text opts the "text" format into incremental, one-log-per-line
# reads. It requires enable_incremental_read and blob_format: text.
# ------------------------------------------------------------------------------
  azureblobpolling/text_lines:
    connection_string: "DefaultEndpointsProtocol=https;AccountName=your_account_name;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
    container: "app-logs"
    poll_interval: 1m
    telemetry_type: "logs"
    blob_format: "text"
    storage: "file_storage"
    enable_incremental_read: true
    enable_per_line_text: true
    # Plain log blobs (app.log, etc.) carry no parseable time in their path, so derive the
    # blob time from Azure's LastModified. Without this (or a time_pattern) the default
    # path-time layout is required and these blobs would be skipped.
    use_last_modified: true
